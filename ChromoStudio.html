<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoChalk Studio - Interactive Teaching Suite</title>
    
    <!-- Custom Browser Tab Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M9 23l3.5-.9 9.6-9.6-2.6-2.6-9.6 9.6L9 23zm13.3-12.3c.4-.4.4-1 0-1.4l-1.2-1.2c-.4-.4-1-.4-1.4 0l-.9.9 2.6 2.6.9-.9z' fill='%23ffffff'/></svg>">

    <style>
        :root {
            --primary-accent: #6366f1;
            --primary-hover: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #f8fafc;
        }

        /* Top Brand & Floating Glass Dock */
        #toolbar-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 98vw;
            overflow-x: auto;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 14px;
            color: #4338ca;
            padding-right: 8px;
            border-right: 2px solid #cbd5e1;
            letter-spacing: -0.5px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 5px;
            border-right: 1px solid #cbd5e1;
            padding-right: 8px;
            white-space: nowrap;
        }

        .tool-group:last-child {
            border-right: none;
            padding-right: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 8px;
            color: #475569;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(241, 245, 249, 0.9);
            color: #0f172a;
        }

        .btn.active {
            background: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .btn-green { background: #10b981; color: white; }
        .btn-green:hover { background: #059669; }

        .btn-purple { background: #8b5cf6; color: white; }
        .btn-purple:hover { background: #7c3aed; }

        .btn-orange { background: #f59e0b; color: white; }
        .btn-orange:hover { background: #d97706; }

        .btn-red { background: #ef4444; color: white; }
        .btn-red:hover { background: #dc2626; }

        input[type="color"] {
            appearance: none;
            border: 2px solid #ffffff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        select {
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            font-size: 12px;
            font-weight: 500;
            color: #334155;
            outline: none;
            cursor: pointer;
        }

        /* Workspace & Canvas */
        .workspace {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Bottom Page Control Deck */
        #page-deck {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .page-indicator {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            min-width: 80px;
            text-align: center;
        }

        /* Sidebar Drawer */
        #filesSidebar {
            position: absolute;
            top: 0;
            right: -360px;
            width: 360px;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-left: 1px solid #e2e8f0;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            z-index: 40;
        }

        #filesSidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sidebar-header h3 {
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .note-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .note-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .note-thumb {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-bottom: 1px solid #f1f5f9;
        }

        .note-details {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-title-text {
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
        }

        /* Canvas Themes */
        .bg-white { background-color: #ffffff; }
        .bg-grid { 
            background-color: #f8fafc;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 28px 28px;
        }
        .bg-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .bg-dark {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 28px 28px;
        }
    </style>
</head>
<body class="bg-grid" id="mainBody">

    <!-- TOP FLOATING DOCK -->
    <div id="toolbar-container">
        <div class="brand-logo">ChronoChalk</div>

        <!-- Primary Drawing Tools -->
        <div class="tool-group">
            <button class="btn active" onclick="setTool('pen')">✏️ Pen</button>
            <button class="btn" onclick="setTool('highlighter')">🖍️ Highlight</button>
            <button class="btn btn-red" onclick="setTool('laser')">🔴 Laser</button>
            <button class="btn" onclick="setTool('text')">🔤 Text</button>
            <button class="btn" onclick="setTool('eraser')">🧹 Eraser</button>
        </div>

        <!-- Geometric Shapes -->
        <div class="tool-group">
            <button class="btn" onclick="setTool('line')">📏 Line</button>
            <button class="btn" onclick="setTool('rectangle')">🔲 Rect</button>
            <button class="btn" onclick="setTool('circle')">⭕ Circle</button>
            <button class="btn" onclick="setTool('triangle')">🔺 Triangle</button>
            <button class="btn" onclick="setTool('diamond')">💎 Diamond</button>
            <button class="btn" onclick="setTool('bubble')">💬 Callout</button>
            <button class="btn" onclick="setTool('arrow')">➡️ Arrow</button>
        </div>

        <!-- Advanced Insert Tools -->
        <div class="tool-group">
            <button class="btn btn-orange" onclick="promptInsertTable()">📊 Table</button>
            <button class="btn btn-orange" onclick="triggerImageUpload()">🖼️ Image</button>
            <input type="file" id="imageLoader" accept="image/*" style="display:none;" onchange="handleImage(event)">
            <button class="btn btn-orange" onclick="promptMathEquation()">∑ Math Eq</button>
        </div>

        <!-- Style Properties -->
        <div class="tool-group">
            <input type="color" id="colorPicker" value="#4f46e5">
            <input type="range" id="sizeSlider" min="1" max="40" value="4" style="width: 65px;">
        </div>

        <!-- Themes -->
        <div class="tool-group">
            <select id="bgSelect" onchange="changeBackground(this.value)">
                <option value="bg-grid">📐 Grid</option>
                <option value="bg-white">📄 White</option>
                <option value="bg-dots">⚫ Dots</option>
                <option value="bg-dark">🌙 Chalkboard</option>
            </select>
        </div>

        <!-- System Actions -->
        <div class="tool-group">
            <button class="btn" onclick="undo()">↩️ Undo</button>
            <button class="btn" onclick="clearCanvas()">🗑️ Clear</button>
            <button class="btn btn-green" onclick="saveImage()">💾 Save PNG</button>
            <button class="btn btn-purple" onclick="toggleFilesPanel()">📁 Saved Notes</button>
        </div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">
        <canvas id="whiteboard"></canvas>

        <!-- PAGE NAVIGATION DECK -->
        <div id="page-deck">
            <button class="btn" onclick="changePage(-1)">◀ Prev</button>
            <span class="page-indicator" id="pageIndicator">Page 1 / 1</span>
            <button class="btn" onclick="changePage(1)">Next ▶</button>
            <button class="btn btn-purple" onclick="addNewPage()">+ New Slide</button>
        </div>

        <!-- SAVED NOTES SIDEBAR -->
        <div id="filesSidebar">
            <div class="sidebar-header">
                <h3>ChronoChalk Library</h3>
                <button class="btn" onclick="toggleFilesPanel()">✕</button>
            </div>
            <div style="padding: 14px; border-bottom: 1px solid #e2e8f0;">
                <button onclick="promptSaveNote()" class="btn btn-purple" style="width: 100%;">💾 Save Full Lecture Session</button>
            </div>
            <div id="savedNotesList" class="notes-list"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        let painting = false;
        let currentTool = 'pen';
        let startX, startY;
        let snapshot = null;
        let history = [];

        let pages = [null];
        let currentPageIndex = 0;

        function resizeCanvas() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.drawImage(tempCanvas, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#toolbar-container .btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick')?.includes(tool)) {
                    btn.classList.add('active');
                }
            });
        }

        function changeBackground(className) {
            document.getElementById('mainBody').className = className;
            document.getElementById('colorPicker').value = (className === 'bg-dark') ? '#ffffff' : '#4f46e5';
        }

        function saveState() {
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (history.length > 25) history.shift();
        }

        function undo() {
            if (history.length > 0) {
                ctx.putImageData(history.pop(), 0, 0);
            }
        }

        function clearCanvas() {
            saveState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (currentTool === 'text') {
                addTextPrompt(e.offsetX, e.offsetY);
                return;
            }

            painting = true;
            startX = e.offsetX;
            startY = e.offsetY;
            saveState();

            if (['pen', 'highlighter', 'eraser', 'laser'].includes(currentTool)) {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            } else {
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!painting) return;

            const currentX = e.offsetX;
            const currentY = e.offsetY;
            const color = document.getElementById('colorPicker').value;
            const size = document.getElementById('sizeSlider').value;

            if (currentTool === 'pen') {
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalAlpha = 1.0;
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            } 
            else if (currentTool === 'highlighter') {
                ctx.strokeStyle = color;
                ctx.lineWidth = size * 2.5;
                ctx.lineCap = 'square';
                ctx.globalAlpha = 0.35;
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            }
            else if (currentTool === 'laser') {
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 12;
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            else if (currentTool === 'eraser') {
                ctx.strokeStyle = document.getElementById('mainBody').classList.contains('bg-dark') ? '#0f172a' : '#f8fafc';
                ctx.lineWidth = size * 4;
                ctx.lineCap = 'round';
                ctx.globalAlpha = 1.0;
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            }
            else {
                ctx.putImageData(snapshot, 0, 0);
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.globalAlpha = 1.0;
                ctx.beginPath();

                if (currentTool === 'rectangle') {
                    ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
                } 
                else if (currentTool === 'circle') {
                    let radius = Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                } 
                else if (currentTool === 'triangle') {
                    ctx.moveTo(startX + (currentX - startX) / 2, startY);
                    ctx.lineTo(currentX, currentY);
                    ctx.lineTo(startX, currentY);
                    ctx.closePath();
                    ctx.stroke();
                }
                else if (currentTool === 'diamond') {
                    let midX = startX + (currentX - startX) / 2;
                    let midY = startY + (currentY - startY) / 2;
                    ctx.moveTo(midX, startY);
                    ctx.lineTo(currentX, midY);
                    ctx.lineTo(midX, currentY);
                    ctx.lineTo(startX, midY);
                    ctx.closePath();
                    ctx.stroke();
                }
                else if (currentTool === 'bubble') {
                    let w = currentX - startX;
                    let h = currentY - startY;
                    ctx.strokeRect(startX, startY, w, h);
                    ctx.beginPath();
                    ctx.moveTo(startX + 20, startY + h);
                    ctx.lineTo(startX + 10, startY + h + 15);
                    ctx.lineTo(startX + 40, startY + h);
                    ctx.stroke();
                }
                else if (currentTool === 'line') {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(currentX, currentY);
                    ctx.stroke();
                }
                else if (currentTool === 'arrow') {
                    drawArrow(startX, startY, currentX, currentY);
                }
            }
        });

        canvas.addEventListener('mouseup', () => { painting = false; });

        function promptMathEquation() {
            let eq = prompt("Enter Math Equation (e.g., E = mc², ∫ x² dx, √(a² + b²)):", "E = mc²");
            if (!eq) return;
            saveState();
            const color = document.getElementById('colorPicker').value;
            ctx.font = "bold 28px 'Segoe UI', sans-serif";
            ctx.fillStyle = color;
            ctx.fillText(eq, canvas.width / 2 - 100, canvas.height / 2);
        }

        function updatePageIndicator() {
            document.getElementById('pageIndicator').textContent = `Page ${currentPageIndex + 1} / ${pages.length}`;
        }

        function saveCurrentPageSnapshot() {
            pages[currentPageIndex] = canvas.toDataURL();
        }

        function loadPageSnapshot(index) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (pages[index]) {
                const img = new Image();
                img.onload = function () {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = pages[index];
            }
        }

        function changePage(direction) {
            saveCurrentPageSnapshot();
            let newIndex = currentPageIndex + direction;
            if (newIndex >= 0 && newIndex < pages.length) {
                currentPageIndex = newIndex;
                loadPageSnapshot(currentPageIndex);
                updatePageIndicator();
            }
        }

        function addNewPage() {
            saveCurrentPageSnapshot();
            pages.push(null);
            currentPageIndex = pages.length - 1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updatePageIndicator();
        }

        function addTextPrompt(x, y) {
            const text = prompt("Enter text or heading:");
            if (text) {
                saveState();
                const color = document.getElementById('colorPicker').value;
                const size = document.getElementById('sizeSlider').value;
                ctx.font = `${parseInt(size) * 4 + 14}px 'Segoe UI', sans-serif`;
                ctx.fillStyle = color;
                ctx.fillText(text, x, y);
            }
        }

        function promptInsertTable() {
            let input = prompt("Enter Table dimensions as Rows,Columns (e.g., 3,3):", "3,3");
            if (!input) return;
            let parts = input.split(',');
            let rows = parseInt(parts[0]) || 3;
            let cols = parseInt(parts[1]) || 3;

            let startX = canvas.width / 2 - (cols * 50);
            let startY = canvas.height / 2 - (rows * 20);
            let cellWidth = 90;
            let cellHeight = 35;

            saveState();
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineWidth = 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    ctx.strokeRect(startX + (c * cellWidth), startY + (r * cellHeight), cellWidth, cellHeight);
                }
            }
        }

        function triggerImageUpload() {
            document.getElementById('imageLoader').click();
        }

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    saveState();
                    let maxWidth = 320;
                    let scale = img.width > maxWidth ? maxWidth / img.width : 1;
                    let w = img.width * scale;
                    let h = img.height * scale;
                    ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function drawArrow(fromX, fromY, toX, toY) {
            const headLength = 16;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(toX, toY);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.fill();
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = 'ChronoChalk-Slide.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function toggleFilesPanel() {
            const sidebar = document.getElementById('filesSidebar');
            sidebar.classList.toggle('open');
            if (sidebar.classList.contains('open')) loadSavedNotesList();
        }

        function promptSaveNote() {
            saveCurrentPageSnapshot();
            const title = prompt("Enter a title for this complete lecture session:", "Session " + new Date().toLocaleDateString());
            if (!title) return;

            let notes = JSON.parse(localStorage.getItem('chronochalk_notes') || '[]');
            notes.unshift({
                id: Date.now(),
                title: title,
                date: new Date().toLocaleDateString(),
                pages: pages,
                bgClass: document.getElementById('mainBody').className
            });
            localStorage.setItem('chronochalk_notes', JSON.stringify(notes));
            loadSavedNotesList();
            alert("Full lecture session saved successfully!");
        }

        function loadSavedNotesList() {
            const listContainer = document.getElementById('savedNotesList');
            let notes = JSON.parse(localStorage.getItem('chronochalk_notes') || '[]');

            if (notes.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:13px; margin-top:30px;">No saved lectures found.</p>';
                return;
            }

            listContainer.innerHTML = '';
            notes.forEach(note => {
                const item = document.createElement('div');
                item.className = 'note-item';
                const thumbData = note.pages[0] || '';
                item.innerHTML = `
                    <img src="${thumbData}" class="note-thumb" alt="Thumbnail">
                    <div class="note-details">
                        <div>
                            <div class="note-title-text">${note.title}</div>
                            <div style="font-size:11px; color:#64748b;">${note.date} • ${note.pages.length} Slides</div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="btn btn-purple" style="padding:4px 8px;" onclick="loadNote(${note.id})">Load</button>
                            <button class="btn" style="padding:4px 8px; color:#ef4444;" onclick="deleteNote(${note.id})">Del</button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function loadNote(id) {
            let notes = JSON.parse(localStorage.getItem('chronochalk_notes') || '[]');
            const note = notes.find(n => n.id === id);
            if (!note) return;

            pages = note.pages;
            currentPageIndex = 0;
            loadPageSnapshot(0);
            updatePageIndicator();

            document.getElementById('mainBody').className = note.bgClass;
            document.getElementById('bgSelect').value = note.bgClass;
            toggleFilesPanel();
        }

        function deleteNote(id) {
            if (!confirm("Delete this saved lecture session permanently?")) return;
            let notes = JSON.parse(localStorage.getItem('chronochalk_notes') || '[]');
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('chronochalk_notes', JSON.stringify(notes));
            loadSavedNotesList();
        }
    </script>
</body>
</html>
